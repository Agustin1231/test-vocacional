# Orquestación de los 4 servicios: levanta la integración real
# (frontend -> backend -> ia -> mysql) en una sola máquina.
#
# Esta es la ÚNICA fuente de verdad de orquestación del repo (regla 3 de
# docs/ARQUITECTURA.md). Ya no es una plantilla: los cuatro servicios existen.
#
# Uso: desde la raíz del repo ->  docker compose -f infra/docker-compose.yml up --build
#
# Los .env reales de cada servicio NO se commitean (ver cada .env.example).
# Estas cuatro variables son obligatorias y NO tienen default: si faltan, el
# compose falla ruidosamente. Podés ponerlas en infra/.env (tampoco se commitea):
#   MYSQL_ROOT_PASSWORD  -> password de root de MySQL
#   MYSQL_USER           -> usuario de aplicación de la base (en producción: `mysql`)
#   MYSQL_PASSWORD       -> password de ese usuario
#   IA_API_KEY           -> clave compartida backend <-> ia (una sola, ver abajo)
#
# Antes del primer `up`, copiá las plantillas de entorno de cada servicio:
#   cp backend/.env.example backend/.env   &&  cp ia/.env.example ia/.env
# (los dos `env_file` son opcionales, así que si faltan el compose valida igual y
# el fallo lo reporta cada servicio con un mensaje concreto).
#
# OJO con backend/.env y ia/.env: DB_HOST tiene que valer `mysql` (nombre del
# servicio de acá), no `localhost`, para alcanzar la base por la red interna; y
# las credenciales de la base tienen que coincidir con las de MySQL.

services:
  frontend:
    build: ../frontend
    restart: unless-stopped
    environment:
      # URL a la que nginx proxea /api (ver frontend/nginx.conf).
      BACKEND_URL: http://backend:5000
      # Host header que nginx manda al proxear. Acá coincide con el nombre del
      # servicio porque se le pega directo al backend; en producción es el FQDN
      # del backend, porque el salto pasa por Traefik y ese header es lo único
      # con lo que Traefik decide a qué contenedor rutear (docs/DESPLIEGUE.md,
      # sección 3). Va explícito aunque el Dockerfile ya lo traiga por default:
      # el default vive en la imagen y esto se lee acá al lado de BACKEND_URL,
      # que es la variable con la que tiene que moverse en pareja.
      BACKEND_HOST: backend
    ports:
      - "8080:80"
    depends_on:
      # service_started a propósito: la SPA se tiene que servir aunque el
      # backend todavía no esté sano.
      backend:
        condition: service_started
    networks:
      - vocacional

  backend:
    build: ../backend
    restart: unless-stopped
    env_file:
      # required: false a propósito: el archivo está gitignoreado y en un clon
      # fresco no existe. Si fuera obligatorio, `docker compose config` (y el CI)
      # abortarían con un `stat: no such file or directory` en vez de llegar a los
      # mensajes útiles de las variables `:?` y de Program.cs.
      - path: ../backend/.env
        required: false
    environment:
      # Origen del frontend permitido por CORS (el puerto publicado acá arriba).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Puerto de escucha de Kestrel. Va acá además del Dockerfile porque
      # `environment` pisa el env_file: el puerto no puede depender del .env del
      # operador (todo el resto del compose y nginx asumen 5000).
      ASPNETCORE_URLS: http://+:5000
      # Nunca Development en un despliegue: expondría Swagger y las páginas de
      # error con stack trace + SQL (con la PII del estudiante).
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # El backend alcanza la IA por la red interna; `ia` es el nombre del servicio.
      IA_BASE_URL: http://ia:8000
      # Misma clave que SERVICE_API_KEY del servicio de IA: una sola variable.
      IA_API_KEY: ${IA_API_KEY:?falta IA_API_KEY (clave compartida backend <-> ia)}
    ports:
      # Solo loopback: el camino público al backend es nginx (que agrega
      # X-Forwarded-For). Publicarlo en 0.0.0.0 dejaba saltear el proxy y forjar
      # esa cabecera para evadir el rate limit del login.
      - "127.0.0.1:5000:5000"
    depends_on:
      # El backend no arranca antes de que MySQL acepte conexiones.
      mysql:
        condition: service_healthy
      # La IA solo hace falta para el chat: no bloquea el arranque del backend.
      ia:
        condition: service_started
    healthcheck:
      # La imagen aspnet:8.0 no trae curl ni wget, pero sí bash: pedimos
      # GET /health por /dev/tcp y verificamos que responda 200.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - vocacional

  ia:
    build: ../ia
    restart: unless-stopped
    env_file:
      # Ver la nota del backend: opcional para que un clon fresco falle con un
      # mensaje útil y `docker compose config` siga siendo ejecutable.
      - path: ../ia/.env
        required: false
    environment:
      # Tiene que ser la misma clave que IA_API_KEY del backend, que la manda en
      # el header X-API-Key. Pisa lo que traiga ia/.env.
      SERVICE_API_KEY: ${IA_API_KEY:?falta IA_API_KEY (clave compartida backend <-> ia)}
      # Base de documentos del RAG (plan de estudios). Va acá y no en ia/.env
      # porque el host es el nombre del servicio de este compose.
      #
      # RAG_DB_PASSWORD viaja dentro de una URL: si le ponés caracteres como @, /
      # o :, hay que percent-encodearlos. Generala alfanumérica y no hay problema.
      VECTOR_STORE_URL: postgresql+psycopg://rag:${RAG_DB_PASSWORD:?falta RAG_DB_PASSWORD}@ragdb:5432/rag
    depends_on:
      # service_started y no service_healthy a propósito: el servicio de IA
      # funciona sin la base de documentos (responde igual, sin la herramienta de
      # búsqueda), así que no tiene sentido bloquear su arranque. Si la base
      # todavía no aceptaba conexiones, `rag/store.py` reintenta la
      # inicialización en la primera operación.
      ragdb:
        condition: service_started
    # Sin `ports`: no se expone al host; solo lo alcanza el backend por red interna.
    healthcheck:
      # La imagen python:3.12-slim no trae curl ni wget: usamos el propio python.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vocacional

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: test_vocacional
      # Sin default a propósito: si no está definida, el compose falla y no se
      # levanta una base con password conocida.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD}
      # Usuario de aplicación. Es el que usan backend e IA en DB_USER/DB_PASSWORD,
      # igual que en producción (allá vale `mysql` y tiene permisos solo sobre
      # test_vocacional). Antes acá existía únicamente root, y esa era la
      # diferencia de fondo con el despliegue real: local corría como superusuario
      # de todo el servidor, así que un GRANT faltante no se notaba hasta prod.
      #
      # Las dos van sin default y juntas a propósito. La imagen de MySQL crea el
      # usuario SOLO si están las dos: con MYSQL_USER y sin MYSQL_PASSWORD escribe
      # un warning en su log y sigue arrancando, y la base queda healthy pero sin
      # el usuario. El backend recién falla después con "Access denied", que no
      # dice nada sobre la causa.
      MYSQL_USER: ${MYSQL_USER:?falta MYSQL_USER (usuario de aplicación; en producción es `mysql`)}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?falta MYSQL_PASSWORD (password de MYSQL_USER)}
    # Sin `ports`: la base solo se alcanza desde la red interna.
    healthcheck:
      # -h 127.0.0.1 y no el socket: durante la inicialización el servidor
      # temporal arranca sin red, así que esto solo da OK cuando ya está listo.
      # Con credenciales: `mysqladmin ping` sin usuario devuelve 0 incluso con
      # "Access denied", así que marcaba healthy una base inalcanzable (típico
      # cuando el volumen ya estaba inicializado con otra password).
      # $$ para que lo expanda el shell del contenedor, no Compose.
      test:
        - CMD-SHELL
        - "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'USE test_vocacional' >/dev/null 2>&1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vocacional

  ragdb:
    # pgvector sobre Postgres 17: la imagen oficial de pgvector ya trae la
    # extensión compilada, así que `CREATE EXTENSION vector` funciona sin instalar
    # nada (lo hace rag/store.py al arrancar).
    #
    # Es una base SEPARADA del MySQL de negocio, no un esquema más adentro: el
    # dueño del esquema de negocio es el backend con EF Core, y meterle tablas de
    # otro servicio rompería esa propiedad. Ver docs/adr/0004-rag-en-pgvector.md.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      # Sin default, igual que el resto: una base de documentos con password
      # conocida es una base de documentos editable por cualquiera.
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:?falta RAG_DB_PASSWORD}
    # Sin `ports`: solo la alcanza el servicio de IA por la red interna.
    healthcheck:
      # pg_isready con usuario Y base: sin -d consulta la base `rag` por defecto
      # llamada igual que el usuario, que no existe, y devuelve error aunque el
      # servidor esté perfecto.
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - rag_data:/var/lib/postgresql/data
    networks:
      - vocacional

networks:
  vocacional:
    driver: bridge

volumes:
  # OJO al cambiar MYSQL_USER / MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD: la imagen de
  # MySQL solo las aplica cuando inicializa el volumen vacío. Sobre un volumen ya
  # creado las ignora en silencio, y el síntoma es un "Access denied" del backend
  # contra una base que arranca healthy. Para rehacerlo:
  #   docker compose -f infra/docker-compose.yml down -v
  mysql_data:
  # Mismo cuidado con RAG_DB_PASSWORD: Postgres solo la aplica al inicializar el
  # volumen. Acá además se pierden los documentos indexados al borrarlo, y volver
  # a subirlos cuesta una llamada de embeddings por lote.
  rag_data:
