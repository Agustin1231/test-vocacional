# Config de nginx del frontend. OJO: este archivo es una PLANTILLA.
# El Dockerfile lo copia a /etc/nginx/templates/default.conf.template y el
# entrypoint de la imagen oficial de nginx la procesa con envsubst al arrancar,
# dejando el resultado en /etc/nginx/conf.d/default.conf. Ahi se reemplaza
# ${BACKEND_URL} (default en el Dockerfile: http://backend:5000).
#
# Por que plantilla + variable en proxy_pass: si el proxy_pass llevara el
# hostname literal, nginx lo resolveria al arrancar y el contenedor NO ARRANCARIA
# cuando no existe un servicio 'backend' en su red (en Coolify el frontend se
# despliega solo). Con la URL en una variable de nginx la resolucion DNS se hace
# por request contra el DNS interno de Docker (127.0.0.11): si el backend no
# esta, /api devuelve 502 pero la SPA se sigue sirviendo.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Este servicio SIEMPRE vive detras de un proxy (Coolify/TLS). Con redirects
    # absolutos, nginx los construye con su propio esquema (http) y su puerto de
    # escucha (80): https://dominio/assets respondia Location: http://dominio/assets/,
    # degradando a http y perdiendo el puerto publicado. Relativos = correcto.
    absolute_redirect off;

    # Healthcheck del PROPIO nginx. No usar /health: esa ruta cae en el fallback
    # de la SPA y devuelve index.html con 200 aunque todo lo demas este roto
    # (el /health del backend vive en su raiz y no se proxea, ver location /api/).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API del backend (incluye /api/ia/chat, que el backend reenvia al servicio
    # de IA con la API key; el navegador nunca conoce esa clave).
    # BACKEND_URL va sin barra final, ej: http://backend:5000
    # El ^~ hace que este bloque gane sobre el de assets (que es una regex).
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_url "${BACKEND_URL}";
        proxy_pass $backend_url$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El chat con la IA puede tardar mas que el default de 60s.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # SPA de Angular: cualquier ruta cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets con hash. UNA sola cabecera Cache-Control:
    # `expires` ya emite una, y sumarle add_header dejaba dos contradictorias en
    # la respuesta (max-age=2592000 y public, immutable), con el comportamiento
    # final a criterio del proxy/CDN de turno.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, immutable, max-age=2592000";
    }
}
